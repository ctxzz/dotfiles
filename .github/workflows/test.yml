name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck zsh tmux

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck tmux

      - name: Run test suite
        # GitHub Actions ランナーからは dot.omata.me に到達できないため、
        # ネットワーク依存テスト（redirect_test.sh）はCIではスキップする。
        # 到達可能なローカルでは `make test`（フラグ無し）で実行する。
        run: SKIP_NETWORK_TESTS=1 make test

      - name: Ensure tests did not modify the working tree
        # make test は読み取り専用（自動修正は make lint-fix に分離）
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
